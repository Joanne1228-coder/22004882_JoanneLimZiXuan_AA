services:
  moodleapp:
    build:
      context: .
    image: moodleweb:1.0
    container_name: moodleweb
    ports:
      - 80:80
    volumes:
      - moodledata:/var/www/moodledata
      - moodlefile:/var/www/html
    depends_on:
      - postgres
  
  postgres:
    image: postgres:18.1-alpine
    environment:
      - POSTGRES_DB=moodle
      - POSTGRES_USER=moodleuser
      - POSTGRES_PASSWORD=moodle_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "81:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres

volumes:
  pgdata:
  moodledata:
  moodlefile: